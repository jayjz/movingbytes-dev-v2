<rect x="40" y="595" width="250" height="80" fill="#15161a" stroke="#adaeb7" stroke-dasharray="5 5"/>
<g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#f2eee6" font-size="26"><text x="320" y="94">Planner</text><text x="165" y="264">Local model</text><text x="475" y="264">Sandbox tools</text><text x="165" y="464">Compressor</text><text x="475" y="464">AST validator</text><text x="475" y="630">Synthesizer</text><text x="165" y="630">Trajectory</text></g><g fill="#adaeb7" font-size="19"><text x="320" y="125">Configured cloud call</text><text x="165" y="296">Ollama endpoint</text><text x="475" y="296">Docker execution</text><text x="165" y="496">Summarize + sweep</text><text x="475" y="496">Source-to-sink check</text><text x="475" y="658">Cloud if findings · end</text><text x="165" y="658">Separate disk record</text><text x="165" y="370">No tool calls</text><text x="475" y="370">Semgrep → rg fallback</text><text x="475" y="573">Completion route</text></g></g>
