<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" fill="none">
<title>CipherLoop — source-derived workflow overview</title>
<desc>Cloud planner to Ollama local model; local model exchanges tool calls and raw replies with Docker tools. When no tool calls remain, compressor leads to validator. Validator returns to planner or ends through synthesis. Compressor and validator write selected events to a separate trajectory record. See the case study for conditions and complete text equivalent.</desc>
