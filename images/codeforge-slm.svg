<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="800" y2="600">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#g1)"/>
  <circle cx="400" cy="300" r="200" fill="url(#glow)" filter="url(#blur)"/>
  
  <!-- Code nodes grid -->
  <g opacity="0.15" stroke="#00f5d4" stroke-width="0.5">
    <path d="M100 100h600M100 200h600M100 300h600M100 400h600M100 500h600"/>
    <path d="M100 100v400M200 100v400M300 100v400M400 100v400M500 100v400M600 100v400M700 100v400"/>
  </g>
  
  <!-- Agent nodes -->
  <g fill="#00f5d4">
    <circle cx="200" cy="180" r="3" opacity="0.8"/>
    <circle cx="350" cy="220" r="3" opacity="0.9"/>
    <circle cx="480" cy="190" r="3" opacity="0.7"/>
    <circle cx="620" cy="210" r="3" opacity="0.85"/>
    <circle cx="250" cy="320" r="3" opacity="0.8"/>
    <circle cx="400" cy="350" r="4" opacity="1"/>
    <circle cx="550" cy="320" r="3" opacity="0.75"/>
    <circle cx="220" cy="420" r="3" opacity="0.8"/>
    <circle cx="380" cy="450" r="3" opacity="0.9"/>
    <circle cx="580" cy="430" r="3" opacity="0.7"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#00f5d4" stroke-width="0.5" opacity="0.3" fill="none">
    <path d="M200 180l150 40M350 220l130-30M480 190l140 20"/>
    <path d="M200 180l50 140M250 320l150 30M400 350l150-30"/>
    <path d="M250 320l-30 100M380 450l-160-30M380 450l200-20"/>
    <path d="M350 220l50 130M480 190l70 130M620 210l-70 110"/>
  </g>
  
  <!-- Central processing node -->
  <g transform="translate(400 300)">
    <circle r="45" fill="none" stroke="#00f5d4" stroke-width="1" opacity="0.4"/>
    <circle r="35" fill="none" stroke="#00f5d4" stroke-width="1" opacity="0.6"/>
    <circle r="25" fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.8"/>
    <circle r="8" fill="#00f5d4" opacity="0.9"/>
  </g>
  
  <!-- Code fragments -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#b0b0bd" opacity="0.25">
    <text x="120" y="140">transform()</text>
    <text x="520" y="160">validate()</text>
    <text x="140" y="380">decompose</text>
    <text x="540" y="390">audit_trail</text>
    <text x="320" y="520">rollback_state</text>
  </g>
  
  <!-- Scan lines -->
  <g opacity="0.03">
    <rect x="0" y="0" width="800" height="600" fill="url(#scan)"/>
  </g>
  <defs>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="white"/>
    </pattern>
  </defs>
</svg>