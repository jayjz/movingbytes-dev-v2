<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="450">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="schema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <!-- Schema structure background -->
  <g opacity="0.06">
    <rect x="80" y="60" width="640" height="330" rx="8" fill="none" stroke="#00f5ff" stroke-width="1"/>
    <line x1="80" y1="110" x2="720" y2="110" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="280" y1="60" x2="280" y2="390" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="520" y1="60" x2="520" y2="390" stroke="#00f5ff" stroke-width="0.5"/>
  </g>
  
  <!-- Pipeline stages -->
  <g transform="translate(100 140)">
    <!-- Input -->
    <g>
      <rect width="160" height="80" rx="6" fill="#111118" stroke="#333" stroke-width="1"/>
      <text x="12" y="20" font-family="JetBrains Mono" font-size="9" fill="#7a7a88">INPUT</text>
      <g font-family="JetBrains Mono" font-size="8" fill="#b0b0bd">
        <text x="12" y="38">prompt: string</text>
        <text x="12" y="52">schema: JSON</text>
        <text x="12" y="66">temp: 0.3</text>
      </g>
      <circle cx="150" cy="40" r="3" fill="#00f5ff" opacity="0.8"/>
    </g>
    
    <!-- Arrow -->
    <path d="M180 40h40" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- Processing -->
    <g transform="translate(240 0)">
      <rect width="160" height="80" rx="6" fill="#111118" stroke="#00f5ff" stroke-width="1" opacity="0.8"/>
      <rect width="160" height="80" rx="6" fill="url(#schema)"/>
      <text x="12" y="20" font-family="JetBrains Mono" font-size="9" fill="#00f5ff">SLM ENGINE</text>
      <g font-family="JetBrains Mono" font-size="8" fill="#e0e0e5">
        <text x="12" y="38">structured_gen()</text>
        <text x="12" y="52">enforce_schema()</text>
        <text x="12" y="66">validate_output()</text>
      </g>
      <circle cx="150" cy="40" r="3" fill="#00f5ff"/>
      <!-- Activity indicator -->
      <g transform="translate(130 15)">
        <circle r="2" fill="#00f5ff" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    
    <!-- Arrow -->
    <path d="M420 40h40" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- Output -->
    <g transform="translate(480 0)">
      <rect width="160" height="80" rx="6" fill="#111118" stroke="#333" stroke-width="1"/>
      <text x="12" y="20" font-family="JetBrains Mono" font-size="9" fill="#7a7a88">OUTPUT</text>
      <g font-family="JetBrains Mono" font-size="8" fill="#b0b0bd">
        <text x="12" y="38">{</text>
        <text x="18" y="50">"valid": true,</text>
        <text x="18" y="62">"confidence": 0.995</text>
        <text x="12" y="74">}</text>
      </g>
      <circle cx="10" cy="40" r="3" fill="#00f5ff" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Schema validation visualization -->
  <g transform="translate(100 260)">
    <text x="0" y="0" font-family="JetBrains Mono" font-size="9" fill="#7a7a88">SCHEMA COMPLIANCE</text>
    
    <!-- Progress bars -->
    <g transform="translate(0 15)">
      <rect width="300" height="18" rx="3" fill="#0a0a0f" stroke="#222" stroke-width="1"/>
      <rect width="298" height="16" x="1" y="1" rx="2" fill="#00f5ff" opacity="0.15"/>
      <rect width="295" height="16" x="1" y="1" rx="2" fill="#00f5ff" opacity="0.9"/>
      <text x="310" y="12" font-family="JetBrains Mono" font-size="9" fill="#00f5ff">99.5%</text>
    </g>
    
    <g transform="translate(0 42)">
      <rect width="300" height="14" rx="2" fill="#0a0a0f" stroke="#222" stroke-width="1"/>
      <rect width="180" height="12" x="1" y="1" rx="1" fill="#ff2e9a" opacity="0.7"/>
      <text x="310" y="10" font-family="JetBrains Mono" font-size="8" fill="#7a7a88">general: 60%</text>
    </g>
  </g>
  
  <!-- Performance metrics -->
  <g transform="translate(480 260)" font-family="JetBrains Mono" font-size="9">
    <text x="0" y="0" fill="#7a7a88">PERFORMANCE</text>
    <g transform="translate(0 18)" fill="#b0b0bd">
      <text x="0" y="0">latency: <tspan fill="#e0e0e5">42ms</tspan></text>
      <text x="0" y="16">throughput: <tspan fill="#e0e0e5">1.2k/s</tspan></text>
      <text x="0" y="32">cost: <tspan fill="#00f5ff">-90%</tspan></text>
    </g>
  </g>
  
  <!-- Data flow particles -->
  <g opacity="0.7">
    <circle cx="260" cy="180" r="1.2" fill="#00f5ff">
      <animate attributeName="cx" values="260;460" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="180" r="1.2" fill="#00f5ff">
      <animate attributeName="cx" values="260;460" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="185" r="1" fill="#00f5ff">
      <animate attributeName="cx" values="260;460" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#444"/>
    </marker>
  </defs>
  
  <!-- JSON structure ghost -->
  <g opacity="0.03" font-family="JetBrains Mono" font-size="10" fill="white">
    <text x="120" y="350">{</text>
    <text x="140" y="365">"type": "object",</text>
    <text x="140" y="380">"properties": {</text>
    <text x="160" y="395">...</text>
  </g>
</svg>