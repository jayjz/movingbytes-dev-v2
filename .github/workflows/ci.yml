name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validators
        run: |
          npm install -g prettier html-validate

      - name: Prettier check
        run: prettier --check "index.html" "css/**/*.css" "js/**/*.js"

      - name: HTML Validate — Homepage
        run: html-validate index.html

      - name: HTML Validate — Case Studies
        run: |
          for file in work/*.html; do
            echo "Validating $file..."
            html-validate "$file"
          done